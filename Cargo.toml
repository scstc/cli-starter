[package]
name = "cli-starter"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
description = "Rust CLI starter with gh-style Sa-Token login"
license = "Apache-2.0"

[[bin]]
name = "cli-starter"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"
directories = "6"
keyring = "4.2"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.9"
url = "2"

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.8"
predicates = "3"
tempfile = "3"
